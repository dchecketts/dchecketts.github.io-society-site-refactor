name: Deploy Astro Subpath Site

on:
  push:
    branches: [ main ] # Triggers whenever you push changes to main
  workflow_dispatch:   # Allows manual triggers from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Upload Site Assets
        uses: withastro/action@v3 # Automatically resolves dependencies and runs astro build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4